name: Client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publicar imagem da tag image-v* após revisar a distribuição de código e assets'
        type: boolean
        default: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_TELEMETRY: '0'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: Octane/.nvmrc
      - run: corepack enable
      - name: Install and check Octane-Renderer
        working-directory: Octane-Renderer
        run: |
          yarn install --immutable
          yarn compile:fast
          yarn test
      - name: Install and check Octane
        working-directory: Octane
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build

  publish:
    if: github.repository == 'habbinho-hotel/habbinho-client' && github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'image-v') && inputs.publish_image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/habbinho-hotel/habbinho-client:${{ github.ref_name }}
            ghcr.io/habbinho-hotel/habbinho-client:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
